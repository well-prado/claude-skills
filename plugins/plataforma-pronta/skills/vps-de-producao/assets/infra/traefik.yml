# Traefik: recebe todo o tráfego (80/443), tira os certificados do Let's Encrypt e encaminha para os serviços do Swarm
# que tiverem "traefik.enable=true" nos labels de deploy.
#   docker stack deploy -c traefik.yml traefik
# Sobe pela linha de comando, nunca pelo Portainer: um erro aqui derrubaria o próprio Portainer.
#
# DNS direto no servidor (sem proxy na frente): nenhum X-Forwarded-For de fora é confiável, e o Traefik grava o IP
# real de quem conectou. Com a Cloudflare em modo proxy (nuvem laranja), acrescente nas duas entradas
#   --entrypoints.websecure.forwardedHeaders.trustedIPs=<as faixas de https://www.cloudflare.com/ips-v4 e -v6>
# e use SSL "Full (strict)" lá. Nunca confie em 0.0.0.0/0.
services:
  traefik:
    image: traefik:v3.7.15 # versão fixa, nunca latest: o rollback do Swarm precisa de uma versão anterior de verdade
    command:
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedByDefault=false
      - --providers.swarm.network=traefik-public
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # Cabeçalhos "apelidos" (X_Forwarded_For, X.Real.Ip...) são removidos: não dá para forjar os que o Traefik controla.
      - --entrypoints.web.http.aliasHeadersStrategy=delete
      - --entrypoints.websecure.http.aliasHeadersStrategy=delete
      # Certificados: desafio HTTP na porta 80, assim que o DNS do domínio apontar para cá. Não redirecione
      # /.well-known/acme-challenge/* em lugar nenhum: é por ali que o certificado renova.
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.storage=/certificates/acme.json
      - --ping=true
      # Log de acesso em JSON sem o caminho, sem cabeçalho e sem o IP de quem acessou. URLs levam segredo (tokens de
      # link mágico, de nova senha, ?chave= de webhook) e o Referer também; IP é dado pessoal (LGPD). Ficam método,
      # host, status, roteador, serviço, tamanhos e tempos: o suficiente para ver erro e lentidão.
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.fields.names.RequestPath=drop
      - --accesslog.fields.names.ClientAddr=drop
      - --accesslog.fields.names.ClientHost=drop
      - --accesslog.fields.names.ClientPort=drop
      - --accesslog.fields.names.ClientUsername=drop
      - --accesslog.fields.headers.defaultmode=drop
      - --log.level=INFO
      - --global.checkNewVersion=false
      - --global.sendAnonymousUsage=false
    ports:
      # As únicas portas publicadas do servidor. Modo host: o Traefik escuta direto e vê o IP de origem real (no modo
      # ingress do Swarm, o IP vira o do balanceador interno).
      - { target: 80, published: 80, protocol: tcp, mode: host }
      - { target: 443, published: 443, protocol: tcp, mode: host }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certificates:/certificates
    networks:
      - traefik-public
      - painel
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      update_config:
        order: stop-first # as portas 80/443 são do host: o novo só sobe depois que o antigo sai (alguns segundos fora)
        monitor: 30s
        failure_action: rollback # versão nova que não fica saudável volta sozinha para a anterior
      rollback_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s

volumes:
  certificates:

networks:
  traefik-public:
    external: true
  # Só o Traefik e o Portainer, criada pelo setup-server.sh.
  painel:
    external: true
